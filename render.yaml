services:
  # Frontend React app
  - type: web
    name: canairy
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USE_MOCK_DATA
        value: false
      - key: VITE_API_URL
        value: https://canairy-api.onrender.com/api/v1
      - key: NODE_VERSION
        value: "18"
      # AI synthesis is disabled to stop Anthropic token usage.
      # To re-enable: set VITE_CANAIRY_AI_ENABLED=true and re-add VITE_ANTHROPIC_API_KEY in the Render dashboard.
  
  # Backend FastAPI (read-only: serves what the collector stored)
  - type: web
    name: canairy-api
    env: python
    plan: starter  # free instances sleep, so the first visitor waits ~30s
    buildCommand: pip install --upgrade pip && pip install -r api/requirements.txt
    startCommand: uvicorn api.simple_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: canairy-db
          property: connectionString

  # Collector: runs every collector once an hour and saves the readings.
  # This is the only thing that calls outside data sources.
  - type: cron
    name: canairy-collect
    env: python
    schedule: "7 * * * *"
    buildCommand: pip install --upgrade pip && pip install -r api/requirements.txt
    startCommand: python -m api.collect
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: canairy-db
          property: connectionString
      - key: FRED_API_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false

databases:
  - name: canairy-db
    plan: basic-256mb
    databaseName: canairy
    postgresMajorVersion: "16"
